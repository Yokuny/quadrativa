<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bora Jogar · protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --surface-2:#F6F8F5; --ink:#16261D; --muted:#5B6B61; --line:#D6DED7;
  --pitch:#1F5E3B; --pitch-2:#2A7049; --amber:#E8A900; --amber-soft:#FFF4D1; --red:#C8433A; --blue:#2F6FA8;
  --ok:#1F7A45; --ok-soft:#E1F1E6; --warn-bg:#FBE3E0; --warn-ink:#7A1F17; --outer:#DCE3DC; --shadow:0 1px 2px rgba(22,38,29,.08);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1E16; --surface:#172A20; --surface-2:#1C3226; --ink:#E7EFE9; --muted:#9FB2A5; --line:#2B4535;
    --pitch:#1B4D31; --pitch-2:#22593A; --amber:#F2B705; --amber-soft:#3A3212; --red:#E0645A; --blue:#6FA3D6;
    --ok:#5CC486; --ok-soft:#1D3A28; --warn-bg:#3A1A17; --warn-ink:#F3B7B0; --outer:#0A150F; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1E16; --surface:#172A20; --surface-2:#1C3226; --ink:#E7EFE9; --muted:#9FB2A5; --line:#2B4535;
  --pitch:#1B4D31; --pitch-2:#22593A; --amber:#F2B705; --amber-soft:#3A3212; --red:#E0645A; --blue:#6FA3D6;
  --ok:#5CC486; --ok-soft:#1D3A28; --warn-bg:#3A1A17; --warn-ink:#F3B7B0; --outer:#0A150F; --shadow:none;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--outer);color:var(--ink);font:400 15px/1.45 Barlow,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:130px}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;letter-spacing:.2px;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{max-width:100%}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.hdr{position:relative;color:#fff;padding:16px 18px 22px;overflow:hidden;background:repeating-linear-gradient(90deg,var(--pitch) 0 44px,var(--pitch-2) 44px 88px)}
.hdr::after{content:"";position:absolute;right:-60px;top:50%;width:150px;height:150px;border:2px solid rgba(255,255,255,.35);border-radius:50%;transform:translateY(-50%)}
.hdr::before{content:"";position:absolute;right:15px;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.35)}
.hdr-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.24);padding:6px 12px;border-radius:99px;font-weight:600;font-size:14px;color:#fff}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;opacity:.9}
.hdr h1{font-size:32px;line-height:1.02;margin-top:14px;position:relative;z-index:1;max-width:82%}
.hdr p{margin:6px 0 0;opacity:.9;position:relative;z-index:1;max-width:80%}

main{padding:14px 14px 10px}
.sec{margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2{font-size:22px}
.sec small{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
button.card{width:100%;text-align:left;display:block}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);margin:2px 4px 2px 0}
.tag.good{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.tag.bad{background:var(--red);border-color:transparent;color:#fff}
.tag.amb{background:var(--amber-soft);border-color:transparent}
.tipo{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;color:#fff;white-space:nowrap}
.tipo.Futsal{background:#A67700}.tipo.Society{background:var(--pitch-2)}
.crest{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;flex:none}
.stars{position:relative;display:inline-block;font-size:14px;line-height:1;letter-spacing:1px;color:var(--line);white-space:nowrap;vertical-align:-1px}
.stars span{position:absolute;left:0;top:0;overflow:hidden;color:var(--amber)}
.score{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.btn.pri{background:var(--pitch);color:#fff;border-color:transparent}
.btn.amb{background:var(--amber);color:#1c1600;border-color:transparent}
.btn.danger{background:var(--red);color:#fff;border-color:transparent}
.btn.block{width:100%;padding:14px;font-size:16px}
.btn.sm{padding:8px 10px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.board .tn{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;line-height:1.1}
.board .x{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;color:var(--muted)}
.status{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:14px}
.status div{display:flex;gap:8px;align-items:flex-start}
.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.dot.ok{background:var(--ok)}.dot.wait{background:var(--amber)}.dot.bad{background:var(--red)}
.lock{color:var(--muted);font-size:13px}
.note{background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}

.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.day{flex:none;width:58px;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center}
.day b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:20px}
.day small{color:var(--muted);font-size:12px}
.day[aria-pressed="true"]{background:var(--pitch);color:#fff;border-color:var(--pitch)}
.day[aria-pressed="true"] small{color:#fff}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:12px 4px;border-radius:10px;border:1.5px solid var(--pitch-2);background:var(--surface);font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:700}
.slot small{display:block;font-family:Barlow,sans-serif;font-size:11px;font-weight:600;color:var(--muted)}
.slot.busy{border-style:dashed;border-color:var(--line);color:var(--muted);text-decoration:line-through;cursor:not-allowed;background:transparent}
.slot[aria-pressed="true"]{background:var(--pitch);color:#fff;border-color:var(--pitch)}
.slot[aria-pressed="true"] small{color:#fff}

.map{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.map svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.legend{display:flex;gap:12px;padding:8px 12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.gallery{display:flex;gap:8px;overflow-x:auto;margin:-2px 0 10px;scroll-snap-type:x mandatory}
.gallery img,.gallery .ph{flex:none;width:82%;height:170px;object-fit:cover;border-radius:14px;scroll-snap-align:start;border:1px solid var(--line)}
.gallery .ph svg{width:100%;height:100%;display:block;border-radius:14px}
.gallery.one img,.gallery.one .ph{width:100%}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumbs div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.upload{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:12px;padding:16px;background:var(--surface);font-weight:600;cursor:pointer}
.upload input{position:absolute;width:1px;height:1px;opacity:0}

.rank-n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;width:26px;text-align:center;color:var(--muted)}
.bar{height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--amber);border-radius:9px}

.bill{width:100%;border-collapse:collapse;font-size:14px}
.bill td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.bill td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:8px}
.bill tr.tot td{border:0;font-weight:700;font-size:15px;padding-top:9px}
.bill tr.you td{border:0;font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700;color:var(--pitch-2)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:600}
.tbl td:last-child,.tbl th:last-child{text-align:right;white-space:nowrap}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bill tr.you td{color:var(--ok)}}
:root[data-theme="dark"] .bill tr.you td{color:var(--ok)}

nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 2px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;min-width:0}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--pitch-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav button[aria-current="page"]{color:var(--ok)}}
:root[data-theme="dark"] nav button[aria-current="page"]{color:var(--ok)}

#sheet-bg{position:fixed;inset:0;background:rgba(8,16,11,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(440px,100%);max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 16px 20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));transition:transform .25s ease;z-index:31}
body.open #sheet-bg{opacity:1;pointer-events:auto}
body.open #sheet{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.sheet-h h2{font-size:26px}
.x-btn{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:18px;flex:none}
.lb{display:block;font-weight:600;margin:14px 0 6px}
.lb small{font-weight:400;color:var(--muted)}
.inp,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:6px;width:100%;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--pitch-2);box-shadow:inset 0 0 0 1px var(--pitch-2)}
.check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:13px;color:#fff}
.opt[aria-pressed="true"] .check{background:var(--pitch-2);border-color:var(--pitch-2)}
.toggle{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-checked="true"]{background:var(--pitch-2)}
.toggle[aria-checked="true"]::after{left:21px}
.toggle[disabled]{opacity:.5}
.rate-stars{display:flex;gap:4px}
.rate-stars button{font-size:28px;line-height:1;color:var(--line);padding:0 2px}
.rate-stars button.on{color:var(--amber)}
.qr{display:block;margin:6px auto;width:180px;height:180px;background:#fff;padding:10px;border-radius:12px}
.copy{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;background:var(--surface);border:1px dashed var(--line);padding:10px;border-radius:10px}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:40;width:max-content;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:22px}
.stat small{color:var(--muted);font-size:12px}
.empty{text-align:center;padding:24px 14px;color:var(--muted)}
.skill{display:flex;align-items:center;gap:8px;font-size:14px;margin:5px 0}
.skill span:first-child{width:128px;flex:none}
.cta{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px dashed var(--pitch-2);border-radius:14px;padding:12px 14px;margin-bottom:10px;width:100%;text-align:left}
.cta b{display:block}
.cta .plus{width:36px;height:36px;border-radius:50%;background:var(--pitch);color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.modo{display:flex;gap:8px;align-items:flex-start;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:10px;color:var(--muted)}
.modo b{color:var(--ink)}
.modo.on{background:var(--ok-soft);border-color:transparent}
#fab{position:fixed;right:max(12px,calc(50% - 208px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--amber);color:#1c1600;font-weight:700;border-radius:99px;padding:10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.22);font-size:14px}
body.open #fab{display:none}
</style>
</head>
<body>
<div id="app"><div id="hdr"></div><main id="main"></main></div>
<nav id="nav" aria-label="Navegação principal"></nav>
<div id="sheet-bg"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<button id="fab" data-act="sugestao" aria-label="Mandar sugestão">💬 Sugestão</button>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ================== listas fixas ================== */
const SMS='São Mateus do Sul';
const CIDADES=['São Mateus do Sul','Irati','União da Vitória','São João do Triunfo','Rio Azul','Mallet','Rebouças','Antônio Olinto','Paulo Frontin','Fernandes Pinheiro'];
const TIPOS=['Futsal','Society'];
const POSICOES=['Goleiro','Fixo','Zagueiro','Ala','Lateral','Meia','Pivô','Atacante'];
const HABILIDADES=['Veloz','Passe','Finalização','Marcação','Drible','Reflexo','Saída de bola','Defesa de pênalti','Chute de longe','Resistência','Liderança','Cabeceio'];
const FUNCOES=['Árbitro principal','Segundo árbitro','Anotador/cronometrista'];
const CARACT=['Pontual','Imparcial','Conhece a regra','Bom posicionamento','Controle de jogo','Comunicação clara','Paciente'];
const COMODIDADES=['Vestiário','Estacionamento','Iluminação LED','Coberto','Churrasqueira','Bar/lanchonete','Arquibancada','Wi-Fi','Bebedouro','Coletes'];
const PISOS={Futsal:['Madeira','Taco sintético','Piso vinílico','Cimento pintado'],Society:['Grama sintética','Grama natural']};
const NIVEIS=['Iniciante','Intermediário','Avançado'];
const CORES=['#1F5E3B','#B35B1E','#6B3FA0','#2F6FA8','#A12E4B','#C8433A','#556B2F','#8A6A00','#0F6E6E','#333333'];

/* ================== regras e taxas ================== */
const TAXA_APP=.05, CANCEL_H=2, TAXA_CANCEL=.10, RECUSA_H=2, WO_PESO=10, WO_RETIDO=.30, MAX_ARB=2;
const ACEITE_H=2;           // convite: até 2h para aceitar (menos, se o jogo estiver perto)
const PAGAR_H=2;            // pagamento do contratado: até 2h depois do aceite (nunca depois do início)
const LIMITE_H=1;           // aceite, pagamento e confirmação terminam 1h antes do jogo
const CONTRATAR_MIN_H=1.5;  // para sobrar ao menos 15 min de aceite e 15 de pagamento
const CHECKIN_ABRE_H=1;     // check-in abre 1h antes
const CHECKIN_FECHA_MIN=15; // e fecha 15 min depois do início; quem não fez = W.O.
const SUSPENSAO_DIAS=7;     // cartão vermelho: jogador de passe livre que dá W.O. fica 1 semana sem ser convocado
const DURACOES=[1,1.5,2];
const TARIFAS={pix:.0099,cartao:.0349,parcela:.0199,maxParcelas:6}; // exemplo: no app real vêm do gateway
const BANCOS=['Banco do Brasil','Caixa','Itaú','Bradesco','Santander','Nubank','Inter','Sicredi','Sicoob','C6 Bank','PagBank','Mercado Pago','Outro'];
const CHAVES=['CPF','CNPJ','Celular','E-mail','Aleatória'];

/* ================== helpers de tempo ================== */
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function tsDia(dia,hora){const d=new Date();d.setDate(d.getDate()+dia);d.setHours(hora,0,0,0);return d.getTime();}
function diaDe(ts){const a=new Date();a.setHours(0,0,0,0);const b=new Date(ts);b.setHours(0,0,0,0);return Math.round((b-a)/864e5);}
function dayInfo(off){const d=new Date();d.setDate(d.getDate()+off);
  return {lbl:off===0?'Hoje':off===1?'Amanhã':DOW[d.getDay()],dd:String(d.getDate()).padStart(2,'0'),full:`${DOW[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`};}
function fmtTs(ts){const d=new Date(ts);return `${DOW[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} às ${d.getHours()}h${d.getMinutes()?String(d.getMinutes()).padStart(2,'0'):''}`;}
const hrsTo=ts=>(ts-Date.now())/36e5;
function faltam(h){if(h<1)return `${Math.max(0,Math.round(h*60))} min`;if(h<48)return `${Math.floor(h)}h${String(Math.round((h%1)*60)).padStart(2,'0')}`;return `${Math.round(h/24)} dias`;}
const prazo=(ts,h)=>fmtTs(ts-h*36e5);
const novoId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ================== dados de exemplo (fictícios, iguais para todos) ================== */

/* ================== armazenamento: exemplo + local + compartilhado ================== */
let DB=null,USER=null,UID=null,PODE=false,DONO=false,CONECTANDO=true;
const COLS=['times','quadras','jogadores','arbitros','desafios','jogos'];
const LOCAL={times:[],quadras:[],jogadores:[],arbitros:[],desafios:[],jogos:SEED_G,notifs:[],rec:{}};
const SH={denuncias:[],times:[],quadras:[],jogadores:[],arbitros:[],desafios:[],jogos:[],fotos:{},sugestoes:[],notifs:[]};
let quadras=[],times=[],arbitros=[],jogadores=[],desafios=[],allJogos=[];
const GONE=new Set();
function rebuild(){
  const comFotos=q=>({...q,fotos:(SH.fotos[q.id]||[]).slice().sort((a,b)=>a.i-b.i).map(f=>f.data)});
  quadras=[...SEED_Q,...LOCAL.quadras,...SH.quadras.map(comFotos)];
  times=[...SEED_T,...LOCAL.times,...SH.times];
  arbitros=[...SEED_A,...LOCAL.arbitros,...SH.arbitros];
  jogadores=[...SEED_J,...LOCAL.jogadores,...SH.jogadores];
  desafios=[...SEED_D,...LOCAL.desafios,...SH.desafios].filter(d=>!GONE.has(d.id)&&d.ts>Date.now());
  allJogos=[...LOCAL.jogos,...SH.jogos];
  if(UID){const own=SH.times.find(t=>t.owner===UID);if(own)S.meuTime=own.id;}
}
const limpo=o=>{const c=JSON.parse(JSON.stringify(o));delete c._sh;delete c.id;delete c.fotos;delete c.mineLocal;return c;};
function falhaEscrita(e){
  if(e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='revoked')){PODE=false;toast('Você não tem permissão para gravar no teste compartilhado. Seguindo no modo local.');render();}
  else if(e&&e.code==='quota_exceeded')toast('O espaço do teste encheu. Avise quem te mandou o link.');
  else toast('Não consegui salvar agora. Tente de novo.');
}
async function salvar(col,obj){if(!obj||!obj._sh||!DB)return;try{await DB.doc(col+'/'+obj.id).set(limpo(obj));}catch(e){falhaEscrita(e);}}
async function criar(col,obj){
  if(PODE&&DB&&UID){try{await DB.doc(col+'/'+obj.id).set({...limpo(obj),owner:UID,criado:Date.now()});return true;}catch(e){falhaEscrita(e);}}
  LOCAL[col].push({...obj,mineLocal:true});rebuild();return false;
}
async function apagar(col,id){if(DB&&PODE)try{await DB.doc(col+'/'+id).delete();}catch(e){}}
const meu=x=>!!x&&((UID&&x.owner===UID)||!!x.mineLocal);
const exemplo=x=>!!x&&!x._sh&&!x.mineLocal;
/* dados privados (recebimento): só o próprio usuário lê */
async function salvarPriv(chave,dados){
  if(PODE&&DB&&UID){try{await DB.doc(`data/users/${UID}/${chave}`).set(dados);delete LOCAL.rec[chave];return true;}catch(e){}}
  LOCAL.rec[chave]=dados;return false;}
async function lerPriv(chave){
  if(LOCAL.rec[chave])return LOCAL.rec[chave];
  if(DB&&UID){try{const s=await DB.doc(`data/users/${UID}/${chave}`).get();if(s.exists)return s.data();}catch(e){}}
  return null;}

/* ================== notificações ================== */
function alvoTime(id){const t=T(id);if(t._sh)return t.owner;if(t.mineLocal||(exemplo(t)&&t.id===meId()))return 'local';return null;}
function alvoEnt(e){if(!e)return null;if(e._sh)return e.owner;if(e.mineLocal)return 'local';return null;}
async function notificar(alvo,texto,ir='jogos',ic='🔔'){
  if(!alvo)return;const n={texto,ir,ic,criado:Date.now(),lida:false};
  if(alvo!=='local'&&PODE&&DB){try{await DB.doc('notificacoes/'+novoId('n')).set({...n,paraUid:alvo});return;}catch(e){}}
  if(alvo==='local'||alvo===UID){LOCAL.notifs.unshift({...n,id:novoId('n')});renderHdr();}
}
const notifsTodas=()=>[...SH.notifs,...LOCAL.notifs].sort((a,b)=>b.criado-a.criado);
const naoLidas=()=>notifsTodas().filter(n=>!n.lida).length;

/* ================== moderação de textos ================== */
let SAMPLE=null;
const PROIBIDAS=['porra','caralho','merda','puta','putas','fdp','filho da puta','viado*','buceta','arrombad*','otari*','vagabund*','corno*','desgracad*','babaca*','imbecil*','retardad*','cuzao','piranha*','vadia*','crioulo*','bicha*','sapatao','traveco*','fode*','fude*','foder','fuder','pqp','vsf','vtnc','tnc','krl','macaco*','escuro imundo','neguinho'];
const RX_PROIB=new RegExp('(^|[^a-z])('+PROIBIDAS.map(p=>p.endsWith('*')?p.slice(0,-1)+'[a-z]*':p).join('|')+')(?![a-z])');
const semAcento=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
async function moderar(...textos){
  const t=textos.filter(x=>x&&String(x).trim()).join('\n').trim();if(!t)return {ok:true};
  if(RX_PROIB.test(semAcento(t)))return {ok:false,motivo:'o texto tem palavras ofensivas ou de baixo calão'};
  if(SAMPLE){try{toast('Revisando o texto…');const r=await SAMPLE.json(`Você modera textos de um app de futebol amador no Brasil. Bloqueie ofensas, xingamentos, palavrões, racismo, homofobia ou qualquer preconceito, ameaças e exposição de dados pessoais de terceiros. Críticas educadas sobre o jogo são permitidas. Responda só com JSON no formato {"ok": true ou false, "motivo": "frase curta em português"}. Texto entre <<< e >>>:\n<<<${t.slice(0,3000)}>>>`,{modelTier:'quick'});
    if(r&&r.ok===false)return {ok:false,motivo:r.motivo||'o texto parece ofensivo'};}catch(e){}}
  return {ok:true};}
const bloqueado=()=>{const d=me().divida;if(d){toast(`Seu time tem ${brl(d.valor)} em aberto de um W.O. Pague em Jogos para liberar.`);return true;}return false;};
const dividaBanner=()=>{const d=me().divida;return d?`<div class="warn"><b>Seu time tem ${brl(d.valor)} em aberto</b> do W.O. de ${fmtTs(G(d.jogo)?G(d.jogo).ts:d.criado)}. Enquanto não pagar, não pode marcar jogos, aceitar desafios nem contratar.<div style="margin-top:8px"><button class="btn danger sm" data-pagardivida="${me().id}">Pagar ${brl(d.valor)}</button></div></div>`:'';};

/* ================== relógio: prazos e fim automático ================== */
let tickando=false,tickTimer=null;
const agendarTick=()=>{clearTimeout(tickTimer);tickTimer=setTimeout(tick,600);};
function escritor(g){if(!g._sh)return true;const ta=T(g.a);if(ta._sh)return ta.owner===UID;const tb=g.b&&T(g.b);return !!(tb&&tb._sh&&tb.owner===UID);}
async function tick(){
  if(tickando)return;tickando=true;
  try{const now=Date.now();
    for(const g of allJogos.slice()){
      if(g.status!=='ativo'||!escritor(g))continue;let mud=false;
      for(const h of HIRES(g)){
        if(h.status==='convite'&&now>prazoAceite(h,g)){h.status='expirado';mud=true;
          notificar(alvoTime(g[h.side]),`${h.nome} não respondeu em ${ACEITE_H}h. O convite para ${fmtTs(g.ts)} foi estornado.`,'jogos','⏱️');
          notificar(alvoEnt(entDe(h)),`O convite do ${T(g[h.side]).nome} para ${fmtTs(g.ts)} expirou.`,painelDe(h),'⏱️');}
        else if(h.status==='aceito'&&!pagoH(h,h.side)&&now>prazoPag(h,g,h.side)){h.status='cancelado';mud=true;
          notificar(alvoEnt(entDe(h)),`O ${T(g[h.side]).nome} não pagou em ${PAGAR_H}h. A contratação de ${fmtTs(g.ts)} foi cancelada.`,painelDe(h),'⏱️');
          notificar(alvoTime(g[h.side]),`O prazo para pagar ${h.nome} acabou. A contratação foi cancelada e nada foi cobrado.`,'jogos','⏱️');}
      }
      if(g.b&&!confirmado(g,'b')&&g.bEm&&now>prazoConf(g)){const quem=T(g.b).nome;
        notificar(alvoTime(g.b),`O prazo para confirmar o jogo de ${fmtTs(g.ts)} acabou. O convite foi estornado.`,'jogos','⏱️');
        notificar(alvoTime(g.a),`${quem} não confirmou o jogo de ${fmtTs(g.ts)} no prazo. Ele virou desafio aberto.`,'jogos','⏱️');
        g.b=null;g.bEm=0;g.pago.b=0;g.confB=false;mud=true;
        if(limiteDe(g)>now)await criar('desafios',{id:novoId('d'),time:g.a,quadra:g.quadra,ts:g.ts,dur:g.dur||1,obs:'Horário já reservado. Falta o adversário.',jogoId:g.id});}
      if(autoCheckin(g))mud=true;
      if(now>ckFecha(g)&&!g.ckFechado){await fecharCheckin(g);mud=true;}
      if(g.status==='ativo'&&now>fimDe(g)){finalizar(g);mud=true;}
      if(mud)await salvarJogo(g,false);
    }
  }finally{tickando=false;}
  render();
}

async function iniciar(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')throw 0;
    [USER,DB]=await Promise.all([window.claude.use('user'),window.claude.use('db')]); // revisão por IA desligada por enquanto (SAMPLE fica nulo)
    if(USER){UID=await USER.id();DONO=await USER.isOwner();}
    if(DB&&UID){
      const pode=USER?await USER.can('data.write'):null;PODE=pode!==false;
      COLS.forEach(col=>DB.collection(col).onSnapshot(snap=>{SH[col]=snap.docs.map(d=>({...JSON.parse(JSON.stringify(d.data())),id:d.id,_sh:true}));rebuild();render();agendarTick();},()=>{}));
      DB.collection('fotos').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{const f=d.data();(m[f.quadra]=m[f.quadra]||[]).push({i:f.i,data:f.data});});SH.fotos=m;rebuild();render();},()=>{});
      DB.collection('notificacoes').where('paraUid','==',UID).onSnapshot(snap=>{SH.notifs=snap.docs.map(d=>({...d.data(),id:d.id,_sh:true}));renderHdr();if(openSheet.key==='notifs')redraw();},()=>{});
      if(DONO)DB.collection('denuncias').onSnapshot(snap=>{SH.denuncias=snap.docs.map(d=>d.data());if(S.tab==='perfil')render();},()=>{});
      if(DONO)DB.collection('sugestoes').onSnapshot(snap=>{SH.sugestoes=snap.docs.map(d=>d.data());if(S.tab==='perfil')render();},()=>{});
    }
  }catch(_){}
  CONECTANDO=false;rebuild();render();tick();setInterval(tick,15000);

function acertoWO(g){
  const q=vq(g),meia=q/2,arb=arbTotal(g),ls=['a','b'].filter(x=>g[x]);

  ls.forEach(x=>{const l=L[x],fundos=l.pQ+l.pA+l.pC;
    if(!l.falt){l.custo=contrib(x);l.volta=fundos-l.custo;l.deve=0;quadraAgora+=l.custo;l.pendQ=l.pendA=0;}
    else{const cq=restoQ/nF,ca=arb/nF;l.custo=cq+ca;l.volta=Math.max(0,fundos-l.custo);l.deve=Math.max(0,l.custo-fundos);
      l.pendQ=Math.max(0,cq-fundos);l.pendA=Math.max(0,ca-Math.max(0,fundos-cq));quadraAgora+=cq-l.pendQ;quadraPend+=l.pendQ;arbPend+=l.pendA;}});
  const taxa=ls.reduce((t,x)=>t+(L[x].pQ+L[x].pA+L[x].jog),0)*TAXA_APP;

}

/* ================== JOGOS ================== */
function linhaHire(h,p){const g=p.g,s=p.s,o=p.o,now=Date.now(),k=`${g.id}|${h.cid}`,quem=`${esc(h.nome)} (${esc(h.papel)})`,eu=h.side===s;
  if(h.status==='convite'){const lim=prazoAceite(h,g);
    return `<div><span class="dot wait"></span><span>Convite para ${quem} · ${brl(h.preco)} · responde até ${fmtHora(lim)}${exemplo(entDe(h))?' <span class="muted">(exemplo: aceita sozinho)</span>':''}${eu?` <button class="btn sm" style="margin-top:4px" data-simexp="${k}">Simular: ${ACEITE_H}h sem resposta</button>`:''}</span></div>`;}
  if(h.status==='aceito'){
    const meuDeve=lados(h,g).includes(s)&&!pagoH(h,s)&&!cobertoH(h,s);
    if(meuDeve){const lim=prazoPag(h,g,s);
      if(now<=lim)return `<div><span class="dot wait"></span><span>${quem} aceitou. Pague ${brl(deveH(h,g,s))}${caucaoH(h,g,s)?` (com caução de ${brl(caucaoH(h,g,s))})`:''} até ${fmtHora(lim)}.<br><button class="btn pri sm" style="margin-top:4px" data-pagarh="${k}">Pagar ${brl(deveH(h,g,s))}</button>${eu?` <button class="btn sm" style="margin-top:4px" data-simpag="${k}">Simular: ${PAGAR_H}h sem pagar</button>`:''}</span></div>`;
      return `<div><span class="dot bad"></span>O prazo para pagar sua parte de ${quem} acabou. O outro time decide se paga ou cancela.</div>`;}
    const falta=lados(h,g).filter(x=>!pagoH(h,x)&&!cobertoH(h,x)&&x!==s)[0];
    if(falta&&!g[falta])return `<div><span class="dot wait"></span>${quem} confirmado da sua parte. A parte do adversário é cobrada quando alguém aceitar o jogo.</div>`;
    if(falta&&now>prazoPag(h,g,falta)&&eu)return `<div><span class="dot bad"></span><span>${p.opp?esc(p.opp.nome):'O adversário'} não pagou a parte deles de ${quem}.<br><button class="btn pri sm" style="margin-top:4px" data-cobrir="${k}">Pagar a parte deles (${brl(principal(h,g,falta)*(1+TAXA_APP))})</button> <button class="btn sm" style="margin-top:4px" data-cancelh="${k}">Cancelar árbitro</button></span></div>`;
    return `<div><span class="dot wait"></span>Você já pagou ${quem}. Aguardando ${p.opp?esc(p.opp.nome):'o adversário'} pagar a parte deles até ${fmtHora(prazoPag(h,g,falta))}${p.oppExemplo?'':''}.</div>`;}
  if(h.status==='pago')return `<div><span class="dot ok"></span>${quem} confirmado. O pagamento fica retido e é liberado no fim do jogo.</div>`;
  const txt={recusado:`${quem} recusou. Nada foi cobrado.`,expirado:`Convite para ${quem} expirou (${ACEITE_H}h sem resposta). Nada foi cobrado.`,cancelado:`Contratação de ${quem} cancelada. ${Object.values(h.pg||{}).some(Boolean)?'O valor pago volta para vocês.':'Nada foi cobrado.'}`,desistiu:`${quem} desistiu. O valor pago volta para vocês.`,wo:`${quem} não compareceu (W.O.). O valor volta para vocês.`}[h.status];
  return txt?`<div class="muted"><span class="dot" style="background:var(--line)"></span>${txt}</div>`:'';
}
function ckLinha(g,k,nome){return `<span class="tag ${fezCk(g,k)?'good':''}">${fezCk(g,k)?'✓':'…'} ${esc(nome)}</span>`;}
function cardAtivo(p){const g=p.g,hr=hrsTo(g.ts),pode=hr>CANCEL_H,hs=HIRES(g),cau=caucaoLado(g,p.s)+hs.filter(h=>h.status==='aceito').reduce((t,h)=>t+pagoCaucao(h,g,p.s),0);
  const contrata=hr>CONTRATAR_MIN_H,aberto=ckAberto(g),pagos=hs.filter(h=>h.status==='pago');
  const precisaConfirmar=p.s==='b'&&!p.euConf;
  return `<div class="card"><div class="row between small muted" style="margin-bottom:8px"><span>${fmtTs(g.ts)} · ${durTxt(g.dur||1)} · ${esc(p.q.nome)}</span><b style="color:var(--ink);white-space:nowrap">${hr<=0?'Agora':'em '+faltam(hr)}</b></div>

function novoHire(tipo,ent,papel,side){return {cid:novoId('c'),tipo,ent:ent.id,nome:ent.nome,preco:ent.preco,papel,side,status:'convite',convEm:Date.now(),pg:{},met:{}};}
async function convidar(g,h){
  HIRES(g).push(h);await salvarJogo(g);
  const ent=entDe(h),time=T(g[h.side]).nome;
  notificar(alvoEnt(ent),`${time} quer te contratar como ${h.papel.toLowerCase()} em ${fmtTs(g.ts)} (${Q(g.quadra).nome}). Valor: ${h.preco?brl(h.preco):'passe livre'}. Responda até ${fmtHora(prazoAceite(h,g))}.`,painelDe(h),'📩');
  if(exemplo(ent)){const gid=g.id,cid=h.cid;setTimeout(()=>{const gg=G(gid),hh=gg&&H(gg,cid);if(hh)aceitarH(gg,hh);},2500);}
}
async function aceitarH(g,h){
  if(h.status!=='convite')return;if(Date.now()>prazoAceite(h,g))return toast('O prazo para aceitar acabou.');
  h.status='aceito';h.aceEm=Date.now();
  if(!h.preco){h.pg={};lados(h,g).forEach(s=>h.pg[s]=true);h.status='pago';}
  await salvarJogo(g);
  if(h.status==='pago')notificar(alvoTime(g[h.side]),`${h.nome} aceitou jogar de passe livre como ${h.papel.toLowerCase()} em ${fmtTs(g.ts)}.`,'jogos','✅');
  else{
    notificar(alvoTime(g[h.side]),`${h.nome} aceitou ser ${h.papel.toLowerCase()} em ${fmtTs(g.ts)}. Pague ${brl(deveH(h,g,h.side))} até ${fmtHora(prazoPag(h,g,h.side))}.`,'jogos','✅');
    const o=outro(h.side);if(h.tipo==='arb'&&g.split&&g[o]&&!exemplo(T(g[o])))notificar(alvoTime(g[o]),`${h.nome} vai apitar o jogo de ${fmtTs(g.ts)}. Pague sua parte da arbitragem (${brl(deveH(h,g,o))}) até ${fmtHora(prazoPag(h,g,o))}.`,'jogos','💳');
  }
}
function fecharSePago(g,h){
  if(h.status==='aceito'&&quitado(h,g)){h.status='pago';h.pagoEm=Date.now();
    notificar(alvoEnt(entDe(h)),`Pagamento confirmado: você recebe ${brl(h.preco)} no fim do jogo de ${fmtTs(g.ts)}.`,painelDe(h),'💰');}
}
function reembolsoHire(g,h,motivo){ // avisa quem pagou
  lados(h,g).forEach(s=>{if(g[s]&&(pagoH(h,s)||(s===h.side&&lados(h,g).some(x=>cobertoH(h,x)))))notificar(alvoTime(g[s]),`${motivo} O valor pago por ${h.nome} volta para vocês. ${estornoTxt((h.met||{})[s])}`,'jogos','↩️');});
}
async function executarPagamento(pay){
  const a=pay.acao,met=pay.met;
  if(a.k==='reserva')return concluirReserva(a.res,met);
  if(a.k==='divida'){const t=T(a.t),d=t.divida;if(!d)return;const g=G(d.jogo);delete t.divida;await salvar('times',t);
    if(g&&g.acerto){g.acerto.quitado=true;g.acerto.quadraAgora+=g.acerto.quadraPend;g.acerto.arbAgora+=g.acerto.arbPend;const qp=g.acerto.quadraPend,ap=g.acerto.arbPend;g.acerto.quadraPend=0;g.acerto.arbPend=0;
      if(qp)notificar(alvoEnt(Q(g.quadra)),`O ${t.nome} quitou a pendência do W.O. de ${fmtTs(g.ts)}. Você recebeu ${brl(qp)}.`,'perfil:quadra','💰');
      if(ap)HIRES(g).filter(h=>h.tipo==='arb'&&h.status==='pago').forEach(h=>notificar(alvoEnt(entDe(h)),`O ${t.nome} quitou a pendência do W.O. de ${fmtTs(g.ts)}. Sua arbitragem foi liberada.`,painelDe(h),'💰'));
      await salvarJogo(g);}
    rebuild();render();return toast('Pendência paga. O time está liberado.');}
  const g=G(a.g),s=P(g).s;
  if(a.k==='parte'){g.pago[s]=g.parte[s];(g.metodo=g.metodo||{})[s]=met;await salvarJogo(g);
    const o=outro(s);if(g[o])notificar(alvoTime(g[o]),`${T(g[s]).nome} pagou a parte dele da quadra para ${fmtTs(g.ts)}.`,'jogos','💳');return toast('Pagamento aprovado.');}
  const h=H(g,a.cid);if(!h||h.status!=='aceito')return toast('Essa contratação não está mais aguardando pagamento.');
  if(a.k==='hire'){h.pg[s]=true;(h.met=h.met||{})[s]=met;const o=outro(s);if(lados(h,g).includes(o)&&g[o]&&exemplo(T(g[o]))&&!pagoH(h,o))h.pg[o]=true;}
  if(a.k==='cobrir'){const o=outro(s);h.pg[o]='cobre';}
  fecharSePago(g,h);await salvarJogo(g);return toast(h.status==='pago'?`Pago. ${h.nome} está confirmado.`:'Pagamento aprovado. Falta a parte do adversário.');
}
async function concluirReserva(R,met){
  const q=Q(R.q),dur=R.dur||1,c=calc(q,R.split,dur),m=meId();let g;
  if(R.jogoId){g=G(R.jogoId);g.b=m;g.bEm=Date.now();g.confB=true;g.pago.b=g.parte.b;(g.metodo=g.metodo||{}).b=met;await salvarJogo(g);
    notificar(alvoTime(g.a),`${T(m).nome} aceitou seu desafio de ${fmtTs(g.ts)} e pagou a parte dele.`,'jogos','🤝');
    arbAtivos(g).filter(h=>h.status==='aceito').forEach(h=>notificar(alvoTime(m),`Pague sua parte da arbitragem de ${h.nome} (${brl(deveH(h,g,'b'))}) até ${fmtHora(prazoPag(h,g,'b'))}.`,'jogos','💳'));}
  else{
    const deD=!!R.desafio,a=deD?R.opp:m,b=deD?m:(R.opp==='aberto'?null:R.opp),mySide=deD?'b':'a';
    g={id:novoId('g'),quadra:q.id,ts:tsDia(R.dia,R.hora),dur,vq:q.preco*dur,a,b,bEm:b?Date.now():0,confB:deD,split:R.split,parte:{a:c.parte,b:R.split?c.parte:0},pago:{a:deD?0:c.parte,b:deD?c.parte:0},metodo:{[mySide]:met},status:'ativo',nota:{},contr:[]};
    if(await criar('jogos',g)){g._sh=true;g.owner=UID;if(!SH.jogos.some(x=>x.id===g.id))SH.jogos.push(g);rebuild();}else g=G(g.id)||g;
    if(deD)notificar(alvoTime(a),`${T(m).nome} aceitou seu desafio de ${fmtTs(g.ts)}. Pague sua parte da quadra (${brl(g.parte.a)}).`,'jogos','🤝');
    else if(b)notificar(alvoTime(b),`${T(m).nome} marcou um jogo contra vocês em ${fmtTs(g.ts)} (${q.nome}, ${durTxt(dur)}). Confirme ${R.split?`pagando a sua parte (${brl(g.parte.b)})`:'o jogo'} ou recuse até ${fmtHora(prazoConf(g))}. Sem resposta, o convite é estornado.`,'jogos','📅');
    else await criar('desafios',{id:novoId('d'),time:m,quadra:q.id,ts:g.ts,dur,obs:'Horário já reservado. Falta o adversário.',jogoId:g.id});
    for(const [i,id] of R.arbs.entries())await convidar(g,novoHire('arb',A(id),i?'Segundo árbitro':'Árbitro principal',mySide));
  }

  S.pendOpp=null;rebuild();go('jogos');toast(R.arbs.length?'Horário reservado. O árbitro foi convidado.':'Pagamento aprovado. Horário reservado.');
}

      const ok=await criar('arbitros',{id,cidade:c.cidade,nome:c.nome.trim(),preco:+c.preco,r:0,jogos:0,bairro:c.bairro.trim()||'—',exp:+c.exp||0,cert:c.cert,tipos:[...c.tipos],funcoes:FUNCOES.filter(f=>c.funcoes.includes(f)),carac,rec:{tipo:c.rec.tipo,resumo:recResumo(c.rec)}});
      await salvarPriv('rec_'+id,c.rec);
      S.cidade=c.cidade;F={};closeSheet();rebuild();S.ct='arbitros';S.tipoF='Todos';go('contratar');return toast(ok?'Perfil publicado. Os times já podem te chamar.':'Perfil publicado neste aparelho.');}
    case 'salvarPlacar':{const pl=F.pl,g=G(pl.g);if(pl.a===''||pl.b==='')return toast('Informe os gols dos dois times.');g.placar=`${+pl.a} x ${+pl.b}`;F={};closeSheet();await salvarJogo(g);
      ['a','b'].forEach(x=>{if(g[x])notificar(alvoTime(g[x]),`A quadra informou o placar do jogo de ${fmtTs(g.ts)}: ${T(g.a).nome} ${g.placar} ${T(g.b).nome}.`,'jogos','📋');});return toast('Placar registrado.');}
    case 'enviarDenuncia':{const c=F.dn,item={tipo:c.tipo,alvo:c.id,nome:(c.tipo==='time'?T(c.id):c.tipo==='jog'?J(c.id):A(c.id)).nome,motivo:c.motivo,texto:c.texto.trim().slice(0,1500),quando:Date.now()};
      if(PODE&&DB&&UID){try{const ref=DB.doc('denuncias/'+UID),snap=await ref.get(),prev=snap.exists?((snap.data()||{}).itens||[]):[];await ref.set({itens:[...prev,item].slice(-100)});F={};closeSheet();return toast('Denúncia enviada. A equipe do app vai analisar.');}catch(e){}}
      F={};closeSheet();return toast('Denúncia registrada neste aparelho (modo local).');}
    case 'enviarSugestao':{
      const c=F.sg;if(!c.texto.trim())return toast('Escreva a sugestão');
      const item={tipo:c.tipo,papel:c.papel,tela:c.tela,texto:c.texto.trim().slice(0,2000),nome:c.nome.trim().slice(0,60),quando:Date.now()};
      if(PODE&&DB&&UID){try{const ref=DB.doc('sugestoes/'+UID),snap=await ref.get(),prev=snap.exists?((snap.data()||{}).itens||[]):[];await ref.set({itens:[...prev,item].slice(-100)});F={};closeSheet();return toast('Obrigado! Sugestão enviada.');}catch(e){}}
      const txt=`Sugestão Bora Jogar (${item.tipo}, ${item.papel}, tela ${item.tela}): ${item.texto}${item.nome?` — ${item.nome}`:''}`;
      try{await navigator.clipboard.writeText(txt);F={};closeSheet();return toast('Sugestão copiada. Cole no WhatsApp de quem te mandou o link.');}
      catch(_){openSheet(sh('Copie sua sugestão')+`<p class="small muted" style="margin-top:0">Selecione o texto abaixo e cole no WhatsApp de quem te mandou o link.</p><div class="copy" style="font-family:inherit;font-size:14px">${esc(txt)}</div>`,'sgc');return;}}
  }
});
document.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.bind)return;
  let v=el.value;if(el.dataset.num)v=v===''?'':+v;setP(el.dataset.bind,v);
  if(el.dataset.live){const pos=el.selectionStart;redraw();const n=$('#sheet [data-live]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
});
document.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset)return;
  if(el.dataset.bind&&el.tagName==='SELECT'){let v=el.value;if(el.dataset.num)v=+v;setP(el.dataset.bind,v);redraw();}
  if(el.dataset.bind==='cq.preco')redraw();
  if(el.dataset.fotos){
    const files=[...el.files].slice(0,6-F.cq.fotos.length);
    files.forEach(f=>{const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,640/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);if(F.cq&&F.cq.fotos.length<6){F.cq.fotos.push(cv.toDataURL('image/jpeg',.7));redraw();}};img.src=rd.result;};rd.readAsDataURL(f);});
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('pin')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
$('#sheet-bg').addEventListener('click',closeSheet);
rebuild();render();iniciar();



</script>
</body>
